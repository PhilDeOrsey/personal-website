<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <aside id="sidebar" class="sidebar" aria-label="Site navigation"></aside>
    <main class="page">
      <header class="hero">

      <section class="prose">
